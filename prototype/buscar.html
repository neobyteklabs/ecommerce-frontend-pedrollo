<!doctype html><html lang="es"><head><title>Buscar · Tienda</title><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/premium.css"><link rel="stylesheet" href="css/motion.css">
<script src="js/app.js"></script><script src="js/motion.js" defer></script></head>
<body data-page="Busqueda">
<bsv-header></bsv-header>
<main class="container section" style="padding-top:16px">
  <div id="results"></div>
</main>
<bsv-footer></bsv-footer>
<bsv-bottombar current="buscar"></bsv-bottombar>
<script>
  const q=(new URLSearchParams(location.search).get('q')||'').trim();
  const norm=s=>s.toLowerCase().replace(/\s+/g,'');
  const hits=Object.entries(PRODUCTS).filter(([id,p])=>q&&(norm(p.model+p.name+p.cat+p.hp+'hp').includes(norm(q))));
  const card=([id,p])=>`<a class="product-card" href="producto.html?id=${id}" data-component="ProductCard"><div class="img-slot product" data-slot="${id}"></div><span class="model">${p.model}</span><span class="name">${p.name}</span><span class="specs">${p.hp} HP · ${p.v} · ${p.phase}</span><span class="price">${fmt(p.price)} <small>IVA incl.</small></span><span class="avail">${availLabel(p.avail)}</span></a>`;
  const r=document.getElementById('results');
  if(!q){ r.innerHTML=`<h1 style="font-size:var(--text-2xl)">Buscar</h1>
    <form action="buscar.html" role="search" class="hero-search"><label class="sr-only" for="sq">Buscar</label><div class="input-group"><span>${icon('search')}</span><input id="sq" name="q" type="search" placeholder="Modelo, HP o uso…" autofocus><button class="btn btn-primary btn-sm">Buscar</button></div></form>
    <h3 style="margin-top:32px">Búsquedas frecuentes</h3><div class="chip-list"><a class="chip" href="buscar.html?q=PKm">PKm periféricas</a><a class="chip" href="buscar.html?q=CPm">CPm centrífugas</a><a class="chip" href="buscar.html?q=4SR">4SR sumergibles</a><a class="chip" href="buscar.html?q=1+HP">1 HP</a><a class="chip" href="buscar.html?q=drenaje">Drenaje</a></div>`; }
  else if(hits.length){ r.innerHTML=`<p class="muted small" style="margin:0">Resultados para</p><h1 style="font-size:var(--text-2xl)">“${q}” <span class="muted" style="font-weight:500;font-size:var(--text-lg)">· ${hits.length} productos</span></h1>
    <div class="chip-list" style="margin-bottom:24px"><button class="chip" aria-pressed="true">Todos</button><button class="chip" aria-pressed="false">Superficie</button><button class="chip" aria-pressed="false">Sumergibles</button><button class="chip" aria-pressed="false">En existencia</button></div>
    <div class="product-grid">${hits.map(card).join('')}</div>`; }
  else { r.innerHTML=`<h1 style="font-size:var(--text-2xl)">Sin resultados para “${q}”</h1>
    <div class="empty" data-component="EmptyState/Busqueda"><div class="icon">${icon('search')}</div><h3>No encontramos ese modelo</h3><p>Revisa la ortografía o busca por potencia o uso. También podemos cotizarlo si es un equipo especial.</p>
      <div class="actions"><a class="btn btn-primary" href="categoria.html">Ver todo el catálogo</a><a class="btn btn-secondary" href="https://wa.me/525572589681">${icon('phone')} Pedir cotización</a></div></div>
    <h3>Quizá buscabas</h3><div class="product-grid">${['pkm-60','cpm-158','4sr-2-9','pkm-100'].map(id=>card([id,PRODUCTS[id]])).join('')}</div>`; }
</script>
</body></html>
