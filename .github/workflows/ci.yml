# ============================================================
# Gate del repositorio: pruebas unitarias y build de produccion.
# No despliega: el workflow de despliegue sale del plan de infra.
# ============================================================
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      # Sin RUN en el Dockerfile no hace falta qemu: es solo COPY sobre la base arm64.
      - name: Armar la imagen (sin publicar)
        run: docker build --platform linux/arm64 -t tienda-pedrollo:ci .
